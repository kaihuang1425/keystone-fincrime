<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phone · Keystone</title>
<link rel="stylesheet" href="assets/keystone.css">
<script src="assets/keystone.js"></script>
<link rel="stylesheet" href="assets/fincrime.css">
<link rel="stylesheet" href="assets/keystone-walk.css">
<script src="assets/keystone-walk.js" defer></script>
<style>
body{margin:0}
</style>

<style>
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--ground-2); }
  .ks-stage { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; overflow: hidden; }
  .ks-fit { transform-origin: top left; }
  .ks-raw .ks-stage { padding: 0; display: block; min-height: 0; }
  /* mobile: no shrunken board; the artboard's own mobile layout fills the screen */
  @media (max-width: 760px) {
    html:not(.ks-raw) .ks-stage { padding: 0; display: block; min-height: 0; }
    html:not(.ks-raw) .ks-box { width: auto !important; height: auto !important; }
    html:not(.ks-raw) .ks-fit { transform: none !important; width: 100% !important; height: auto !important; }
    html:not(.ks-raw) .ks-fit > * { width: 100% !important; height: auto !important; min-height: 100vh; min-height: 100svh; }
  }
</style>
</head>
<body>
<div class="ks-stage"><div class="ks-box"><div class="ks-fit" data-w="387" data-h="964">
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: var(--ground); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 14px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); overflow: hidden;" aria-label="Bots">
<span style="padding: 3px; border-radius: 999px; box-shadow: 0 0 0 2px var(--ink);"><span data-k-bot data-shape="house" data-color="chief" data-state="waiting" data-name="Case Lead" style="--size: 40px"></span></span>
<span data-k-bot data-shape="cloud" data-color="pink" data-state="done" data-name="Payments Bot" style="--size: 40px"></span>
<span data-k-bot data-shape="squircle" data-color="blue" data-state="done" data-name="Document Bot" style="--size: 40px"></span>
<span data-k-bot data-shape="flower" data-color="green" data-state="idle" data-name="Screening Bot" style="--size: 40px"></span>
<span data-k-bot data-shape="triangle" data-color="teal" data-state="done" data-name="Match Bot" style="--size: 40px"></span>
</div>

<div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 8px;"><h1 class="h3" style="margin-right: auto;">For the MLRO</h1><span class="k-honest k-honest--synthetic">Synthetic</span></div>
<div class="k-ticket__msg kw-r" style="--d: .3s;"><small>BK-CS204814 · TM04 · TM02</small><span class="kw-hl" style="--d: 1.1s;">14 people</span> paid in over two days. <span class="kw-hl" style="--d: 2s;">£6,200</span> left within the hour.</div>
<div class="kw-row kw-r" style="--d: 2.6s; --m: 3.3s; border-top: 0; padding: 0;"><span class="kw-swap"><span class="kw-dots"><i></i><i></i><i></i></span><span class="k-mk k-mk--bad">↑</span></span><span><b>No document explains it</b><small>Two senders’ banks report scams <button type="button" class="k-cite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path></svg>RPT-4410<span class="k-cite__pop">Sending bank fraud report. The payer's bank reports that its customer was the victim of a scam.<small>Fraud report from a sending bank · synthetic</small></span></button></small></span><span></span></div>
<section class="k-approve kw-r" style="--d: 4s; padding: 16px; gap: 12px;" aria-labelledby="ph-ap">
<div class="k-approve__head">
<span data-k-bot data-shape="house" data-color="chief" data-state="waiting" data-name="Case Lead" style="--size: 32px"></span>
<span class="k-grow"><b id="ph-ap">Money mule activity</b><small>ESC_MULE_ACTIVITY</small></span>
<span class="k-chip k-chip--bad">↑ ESCALATE</span>
</div>
<div class="k-approve__actions">
<button class="k-btn k-btn--text" type="button">Send back</button>
<button class="k-btn k-btn--primary" type="button" style="margin-left: auto;">Take the case</button>
</div>
</section>
<div class="k-event kw-r" style="--d: 5s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path><path d="M12 8v5M12 16h.01"></path></svg><span><b>Nothing asked</b> of the customer</span></div>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 92px; display: flex; justify-content: center;">
<div class="k-toast" role="status" style="animation: none;"><span class="k-mk k-mk--ok">✓</span><span>RFI sent for BK-CS204813.</span><button type="button">Undo</button></div>
</div>

<div style="padding: 12px 16px 20px; border-top: 1px solid var(--line);">
<form class="k-ask">
<div class="k-ask__field">
<label class="k-sr" for="ph-ask">Message Case Lead</label>
<input id="ph-ask" placeholder="Message Case Lead" style="padding-left: 12px;">
<button type="button" class="k-iconbtn" aria-label="Dictate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
</div>
<button type="button" class="k-voice" aria-label="Talk to Case Lead"><i></i><i></i><i></i><i></i><i></i></button>
</form>
</div>
</div>
</div></div></div>

<script>
(function () {
  // Scales the fixed-size artboard to fit the window. Add ?raw for 1:1 (screen recording at its native size).
  var raw = location.search.indexOf('raw') > -1;
  if (raw) document.documentElement.classList.add('ks-raw');
  var fit = document.querySelector('.ks-fit'), W = +fit.dataset.w, H = +fit.dataset.h, box = fit.parentNode;
  fit.style.width = W + 'px'; fit.style.height = H + 'px';
  function size() {
    if (raw || window.innerWidth <= 760) { fit.style.transform = ''; box.style.width = ''; box.style.height = ''; return; }
    var s = Math.min(1, (window.innerWidth - 32) / W, (window.innerHeight - 96) / H);
    fit.style.transform = 'scale(' + s + ')';
    box.style.width = (W * s) + 'px'; box.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', size); size();
})();
</script>

<script>
(function () {
  document.querySelectorAll('.k-approve .k-btn--primary').forEach(function (b) { b.setAttribute('data-k-approve', 'Case taken. Nothing has been asked of the customer.'); });
  var t = document.querySelector('.k-toast'); if (t) t.parentNode.style.display = 'none';
})();
</script>
</body>
</html>
