<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alert queue · Keystone</title>
<link rel="stylesheet" href="assets/keystone.css">
<script src="assets/keystone.js"></script>
<link rel="stylesheet" href="assets/fincrime.css">
<link rel="stylesheet" href="assets/keystone-walk.css">
<script src="assets/keystone-walk.js" defer></script>
<link rel="stylesheet" href="assets/kf.css">
<style>
body{margin:0}
a{color:var(--info)}a:hover{color:var(--ink)}
/* institutions as tabs above the queue */
.aq-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px;scrollbar-width:none}
.aq-tabs::-webkit-scrollbar{display:none}
.aq-inst{flex:none;display:flex;flex-direction:column;gap:1px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;line-height:1.3}
.aq-inst b{font-weight:500;white-space:nowrap}
.aq-inst small{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.aq-inst[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.aq-inst[aria-current="true"] small{color:inherit;opacity:.7}
/* the queue is the main column; the question to send sits beside it */
.aq-main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.aq-side{position:sticky;top:16px}
@media (max-width:960px){.aq-main{grid-template-columns:minmax(0,1fr)}.aq-side{position:static}}
/* one row: title and quiet metadata, one summary sentence, one chip */
a.kq-row,.kq-row{grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:14px 0;border-radius:0}
.kq-row b{display:block}
.kq-id{display:block;margin:1px 0 0;font-family:var(--font-sans);font-size:12.5px}
.kq-line{margin-top:4px;font-size:13.5px;line-height:1.45}
.kq-line .b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kq-end{align-self:start}
@media (max-width:640px){.kq-row{grid-template-columns:minmax(0,1fr)}.kq-end{grid-column:1;justify-items:start}}
.kq-tally{padding-top:14px;border-top:1px solid var(--line)}
.aq-bar{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.aq-bar h2{margin-right:auto}
</style>
</head>
<body>
<div data-theme="light" style="min-height: 100vh; background: var(--ground); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column;">
<header style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--surface);">
<span data-k-bot data-shape="shield" data-color="chief" data-state="idle" data-name="Keystone" style="--size: 28px"></span>
<span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em;">Keystone</span>
<span style="flex-grow: 1;"></span>
<div style="display: flex; align-items: center; gap: 6px;" aria-label="Bots on this queue">
<span data-k-bot data-shape="card" data-color="pink" data-state="working" data-name="Payments Bot" style="--size: 26px"></span>
<span data-k-bot data-shape="doc" data-color="blue" data-state="working" data-name="Document Bot" style="--size: 26px"></span>
<span data-k-bot data-shape="venn" data-color="teal" data-state="working" data-name="Match Bot" style="--size: 26px"></span>
</div>
<span role="img" aria-label="Priya S., analyst" style="width: 34px; height: 34px; border-radius: 999px; background: var(--surface-3); display: grid; place-items: center; font-size: 13px; font-weight: 600;">PS</span>
</header>

<div style="padding: 28px 24px 4px; display: flex; flex-direction: column; gap: 16px;">
<h1 class="h1" style="margin: 0;">Cases to review.</h1>
<nav class="aq-tabs" aria-label="Institutions">
<div class="aq-inst" aria-current="true"><b>Bank</b><small>&nbsp;</small></div>
<div class="aq-inst"><b>Payments and FX</b><small>&nbsp;</small></div>
<div class="aq-inst"><b>E-money</b><small>&nbsp;</small></div>
<div class="aq-inst"><b>Investment</b><small>&nbsp;</small></div>
</nav>
</div>

<div class="aq-main" style="padding: 16px 24px 32px;">

<div class="k-card" data-kq style="min-width: 0;">
<div class="aq-bar">
<h2 class="h3">Bank · queue</h2>
<button class="k-btn k-btn--sm" type="button" data-kq-replay>Replay</button>
</div>
<div class="kq-list"></div>
</div>

<aside class="aq-side">
<section class="k-approve" aria-label="One question to send">
<div class="k-row"><h2 class="h3" style="margin-right: auto;">One question to send</h2><span data-k-bot data-shape="shield" data-color="chief" data-state="waiting" data-name="Case Lead" style="--size: 30px"></span></div>
<div class="k-ticket__msg"><small>&nbsp;</small></div>
<div class="k-row"></div>
<div class="k-row"><button class="k-btn k-btn--text" type="button">Edit</button><button class="k-btn k-btn--primary" type="button" style="margin-left: auto;">Send the request</button></div>
</section>
</aside>

</div>
<footer style="padding: 4px 24px 24px;"><p class="k-meta" style="margin: 0;">All people and companies named here are invented.</p></footer>
</div>

<script>document.documentElement.classList.add('kf-wait')</script>
<script src="assets/kf-config.js"></script>
<script src="assets/kf-data.js"></script>
<script src="assets/kf-queue.js"></script>
</body>
</html>
